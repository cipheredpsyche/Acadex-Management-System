{% extends 'core/auth_base.html' %}
{% block title %}Forgot Password{% endblock %}
{% block body %}
<div class="center-card">
  <h1 class="login-title">Forgot Password</h1>
  <p class="lead">Enter your email address and we will send you a link to reset your password.</p>
  <form method="post">
    {% csrf_token %}
    {% for e in form.email.errors %}<div class="alert alert-error">{{ e }}</div>{% endfor %}
    <div class="field"><label for="{{ form.email.id_for_label }}">Email Address</label>
      <input type="email" name="email" id="{{ form.email.id_for_label }}" class="input" placeholder="Enter your email" required autofocus></div>
    <button class="btn btn-maroon btn-pill" type="submit">Send</button>
  </form>
  <p class="small-link"><a href="{% url 'login' %}">Back to Login</a></p>
</div>
{% endblock %}
