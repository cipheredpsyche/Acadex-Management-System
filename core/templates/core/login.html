{% extends 'core/base.html' %}

{% block title %}
Acadex System
{% endblock %}

{% block content %}

<style>

    html,
    body {
        margin: 0;
        font-family: "Segoe UI", Arial, sans-serif;
        background-color: #f4f4f4;
        padding: 0;
        min-height: 100%;
    }

    body {
        font-family: "Segoe UI", Arial, sans-serif;

        background: linear-gradient(
            135deg,
            #ffffff,
        );

        min-height: 100vh;
    }

    .login-page {
        min-height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;

        padding: 30px 15px;

        box-sizing: border-box;
    }



    .login-card {
        width: 100%;
        max-width: 450px;

        background-color: white;

        border-radius: 20px;

        overflow: hidden;

        box-shadow:
            0 20px 50px rgba(0, 0, 0, 0.30);

        animation: slideUp 0.6s ease;
    }



    @keyframes slideUp {
        from {
            opacity: 0;
            transform: translateY(30px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }


    .login-header {
        background: linear-gradient(
            135deg,
            #650000,
            #800000
        );

        color: white;

        text-align: center;

        padding: 35px 25px;

        position: relative;
    }



    .login-header::before {
        content: "";

        position: absolute;

        width: 150px;
        height: 150px;

        background: rgba(255, 255, 255, 0.06);

        border-radius: 50%;

        top: -80px;
        right: -50px;
    }


    .system-icon {
        width: 75px;
        height: 75px;

        margin: 0 auto 15px;

        display: flex;
        align-items: center;
        justify-content: center;

        background-color: white;

        border-radius: 50%;

        font-size: 35px;

        box-shadow:
            0 8px 20px rgba(0, 0, 0, 0.25);

        position: relative;
        z-index: 2;

        transition: 0.3s;
    }

    .system-icon:hover {
        transform: scale(1.08);
    }


    .system-name {
        font-size: 21px;

        font-weight: 700;

        line-height: 1.4;

        margin-bottom: 8px;

        position: relative;
        z-index: 2;
    }


    .login-subtitle {
        margin: 0;
        font-size: 13px;
        color: rgba(255, 255, 255, 0.85);
        position: relative;
        z-index: 2;
    }



    .login-body {
        padding: 35px 40px 40px;
        background-color: #ffffff;
    }



    .login-title {
        text-align: center;
        color: #800000;
        font-size: 28px;
        font-weight: 700;
        margin: 0 0 10px;
    }



    .system-description {
        text-align: center;
        color: #777;
        font-size: 14px;
        line-height: 1.6;
        margin-bottom: 28px;
    }



    .form-group {
        margin-bottom: 20px;
    }


    .form-label {
        display: block;
        color: #500000;
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 8px;
    }


    .form-control {
        width: 100%;
        height: 48px;
        padding: 10px 14px;
        box-sizing: border-box;
        border: 1px solid #d8baba;
        border-radius: 9px;
        font-size: 14px;
        outline: none;
        transition: 0.25s;
    }


    .form-control::placeholder {
        color: #aaa;
    }


    .form-control:focus {
        border-color: #800000;

        box-shadow:
            0 0 0 3px rgba(184, 37, 37, 0.12);
    }


    .button-group {
        margin-top: 25px;
    }



    .login-btn {
        width: 100%;
        height: 50px;
        border: none;
        border-radius: 50px;
        background: linear-gradient(
            135deg,
            #800000,
            #a52a2a
        );

        color: white;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        transition: 0.25s;
        box-shadow:
            0 6px 15px rgba(128, 0, 0, 0.25);
    }

    .login-btn:hover {
        background: linear-gradient(
            135deg,
            #5c0000,
            #800000
        );

        transform: translateY(-2px);
        box-shadow:
            0 10px 20px rgba(128, 0, 0, 0.30);
    }


    .login-btn:active {
        transform: translateY(0);
    }


    .forgot-container {
        text-align: center;

        margin-top: 15px;
    }


    .forgot-btn {
        display: inline-block;
        padding: 8px 30px;
        border: 1px solid #800000;
        border-radius: 50px;
        color: #800000;

        background-color: white;
        font-size: 13px;
        font-weight: 600;
        text-decoration: none;

        transition: 0.25s;
    }


    .forgot-btn:hover {
        background-color: #800000;
        color: white;
        text-decoration: none;
    }


    .login-footer {
        text-align: center;
        color: #a13636;
        font-size: 12px;

        margin-top: 25px;
    }



    @media (max-width: 576px) {

        .login-page {
            padding: 20px 12px;
        }

        .login-card {
            border-radius: 16px;
        }

        .login-header {
            padding: 30px 20px;
        }

        .system-name {
            font-size: 18px;
        }

        .login-body {
            padding: 30px 25px;
        }

        .login-title {
            font-size: 24px;
        }
    }
</style>



<div class="login-page">

    <div class="login-card">


        <div class="login-header">

            <div class="system-icon">
                🎓
            </div>

            <div class="system-name">
                Acadex System
            </div>

            <p class="login-subtitle">
                Stay Focused, Stay Organized.
            </p>

        </div>


        <div class="login-body">

            <h2 class="login-title">
                Welcome Back
            </h2>


            <form method="POST">

                {% csrf_token %}


                <!-- Username -->

                <div class="form-group">

                    <label class="form-label">
                        Username
                    </label>

                    <input
                        type="text"
                        name="username"
                        class="form-control"
                        placeholder="Enter your username"
                        required>

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label class="form-label">
                        Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        placeholder="Enter your password"
                        required>

                </div>


                <!-- Buttons -->

                <div class="button-group">

                    <button
                        type="submit"
                        class="login-btn">

                        Sign In

                    </button>


                    <div class="forgot-container">

                        <a
                            href="#"
                            class="forgot-btn">

                            Forgot Password?

                        </a>

                    </div>

                </div>

            </form>


            <!-- Footer -->

            <div class="login-footer">
                © 2026 Acadex, All Rights Reserved.
            </div>

        </div>

    </div>

</div>

{% endblock %}
