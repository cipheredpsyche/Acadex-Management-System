{% extends 'core/base.html' %}
{% load static %}

{% block title %}Login - Acadex System{% endblock %}

{% block content %}
<style>
    body {
        background-color: #e5e5e5; /* Matches the grey background outside the white frame */
        font-family: "Segoe UI", Arial, sans-serif;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }

    .login-wrapper {
        background-color: #ffffff;
        width: 100%;
        max-width: 900px;
        display: flex;
        box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        padding: 40px;
        gap: 40px;
        box-sizing: border-box;
    }

    /* Left Side: Form */
    .login-left {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding-right: 20px;
    }

    .login-title {
        color: #650000;
        font-size: 36px;
        font-weight: bold;
        font-family: "Georgia", serif; /* Matches the serif font in Figma */
        margin-bottom: 30px;
    }

    .form-group {
        margin-bottom: 15px;
    }

    .form-label {
        display: block;
        font-size: 11px;
        font-weight: bold;
        margin-bottom: 5px;
        color: #333;
    }

    .form-control {
        width: 100%;
        padding: 12px 15px;
        background-color: #ebdcdc; /* Matches the beige input color */
        border: none;
        border-radius: 8px;
        font-size: 13px;
        box-sizing: border-box;
        outline: none;
    }

    .password-container {
        position: relative;
    }

    .eye-icon {
        position: absolute;
        right: 15px;
        top: 50%;
        transform: translateY(-50%);
        color: #333;
        cursor: pointer;
        font-size: 14px;
    }

    .forgot-link {
        display: block;
        text-align: right;
        font-size: 11px;
        color: #333;
        text-decoration: none;
        margin-top: 5px;
        margin-bottom: 25px;
    }

    .login-btn {
        background-color: #650000;
        color: white;
        border: none;
        border-radius: 20px;
        padding: 10px 50px;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
        display: block;
        margin: 0 auto;
        transition: 0.3s;
    }

    .login-btn:hover {
        background-color: #4a0000;
    }

    .divider {
        display: flex;
        align-items: center;
        text-align: center;
        margin: 30px 0;
        color: #555;
        font-size: 12px;
    }

    .divider::before, .divider::after {
        content: '';
        flex: 1;
        border-bottom: 1px solid #777;
    }

    .divider span {
        padding: 0 15px;
    }

    .social-login {
        text-align: center;
    }

    .social-text {
        font-size: 12px;
        font-weight: bold;
        margin-bottom: 15px;
        color: #000;
    }

    .social-icons img {
        width: 24px;
        margin: 0 10px;
        cursor: pointer;
    }

    /* Right Side: Image */
    .login-right {
        flex: 1;
        display: flex;
        justify-content: flex-end;
    }

    .login-image-placeholder {
        width: 100%;
        max-width: 400px;
        height: 100%;
        min-height: 400px;
        background-color: #650000;
        border-radius: 20px;
        /* Note: Add background-image: url('...'); here later once you export the image from Figma */
    }

    /* Responsive: Stack vertically on small screens */
    @media (max-width: 768px) {
        .login-wrapper {
            flex-direction: column;
            padding: 20px;
        }
        .login-right {
            display: none; /* Hides the large image on mobile phones */
        }
        .login-left {
            padding-right: 0;
        }
    }
</style>

<div class="login-wrapper">
    <!-- Left Side containing the Form -->
    <div class="login-left">
        <h1 class="login-title">LOGIN</h1>
        
        <form method="POST">
            {% csrf_token %}
            
            <div class="form-group">
                <label class="form-label">School ID / Email Address</label>
                <input type="text" name="username" class="form-control" placeholder="Enter your school ID or Email" required>
            </div>
            
            <div class="form-group password-container">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
                <span class="eye-icon">👁️</span>
            </div>
            
            <a href="#" class="forgot-link">Forgot password?</a>
            
            <button type="submit" class="login-btn">Log In</button>
        </form>
        
        <div class="divider">
            <span>Or</span>
        </div>
        
        <div class="social-login">
            <p class="social-text">Continue with Account</p>
            <div class="social-icons">
                <!-- Fallback emojis until you export the actual icons from Figma -->
                <span style="font-size: 20px; margin: 0 5px; color: #1877F2;">📘</span> 
                <span style="font-size: 20px; margin: 0 5px;">🇬</span> 
                <span style="font-size: 20px; margin: 0 5px;">🍎</span>
            </div>
        </div>
    </div>
    
    <!-- Right Side containing the Image -->
    <div class="login-right">
        <div class="login-image-placeholder">
            <!-- Export the maroon room image from Figma and place it in your static folder -->
        </div>
    </div>
</div>
{% endblock %}
